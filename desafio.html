<style>
:root{
  --noche:#0B2238; --azo:#0B3B55; --az:#006491; --cielo:#4FB3E8; --oro:#F2C94C;
  --papel:#FBFCFD; --fondo:#F2F6FA; --osc:#16232E; --gris:#5E6E79; --linea:#DCE6EE;
  --A:#E0506B; --B:#2F7FD1; --C:#E39A1F; --D:#1FA38C;
  --ok:#1E9E6A; --mal:#D0453A;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Lato,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--osc);
  background:radial-gradient(1200px 700px at 10% -10%,#17608F 0%,transparent 60%),radial-gradient(900px 600px at 110% 110%,#0E4A6E 0%,transparent 55%),var(--noche);
  -webkit-tap-highlight-color:transparent;min-height:100%}
h1,h2,h3,.pop,button{font-family:Poppins,system-ui,sans-serif}
button{cursor:pointer;border:0;font:inherit}
input{font-family:inherit}
.oculto{display:none!important}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}
svg{display:block}
/* clases de los diagramas */
.se{font-family:Poppins,sans-serif;font-weight:600;font-size:9px;fill:#16232E}
.sr{font-family:Poppins,sans-serif;font-size:7.4px;fill:#16232E}.st{font-family:Poppins,sans-serif;font-size:6.4px;fill:#16232E}
.sa{font-family:Lato,sans-serif;font-size:9.2px;fill:#16232E}.sc{font-family:Poppins,sans-serif;font-weight:600;font-size:8.2px;fill:#B03A2E}
.th{font-family:Poppins,sans-serif;font-weight:700;font-size:9.2px}
.tc{font-family:Lato,sans-serif;font-size:9.2px;fill:#24323D}.tpk{font-family:Lato,sans-serif;font-weight:700;font-size:9.2px;fill:#24323D}
.tfk{font-family:Lato,sans-serif;font-weight:700;font-size:9.2px;fill:#C8661A}.tt{font-family:Lato,sans-serif;font-size:8.4px;fill:#8A96A0}
.tb{font-family:Poppins,sans-serif;font-weight:700;font-size:5.4px}
.dib{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.dib svg{width:100%;height:100%;max-height:100%}

/* ======================= PROYECTOR ======================= */
#profe{height:100vh;display:flex;flex-direction:column;color:#EAF3F9;overflow:hidden}
.top{display:flex;align-items:center;gap:20px;padding:16px 32px}
.logo{background:#FBFCFD;border-radius:12px;padding:6px 10px;display:flex}
.logo img{height:40px;display:block}
.top .tit{flex:1;display:flex;flex-direction:column;line-height:1.15}
.top .tit b{font-family:Poppins;font-size:22px;color:#fff}
.top .tit span{font-size:15px;color:#A9C6DA}
.puntos{display:flex;gap:7px}
.puntos i{width:12px;height:12px;border-radius:50%;background:#ffffff2e;display:block}
.puntos i.hecho{background:var(--cielo)}.puntos i.ahora{background:var(--oro);box-shadow:0 0 0 4px #F2C94C44}
.codigo-mini{font-family:Poppins;font-size:16px;background:#ffffff14;border:1px solid #ffffff2a;border-radius:12px;padding:6px 14px;color:#CFE3EE}
.codigo-mini b{color:#fff;font-size:22px;letter-spacing:3px;margin-left:6px}
.escena{flex:1;padding:8px 32px 28px;display:flex;flex-direction:column;gap:20px;min-height:0}
.btn{background:var(--oro);color:#2B2100;font-weight:700;font-size:22px;border-radius:14px;padding:13px 30px;box-shadow:0 6px 18px #F2C94C40;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}.btn:disabled{opacity:.4;transform:none;cursor:default}
.btn.claro{background:#ffffff18;color:#fff;box-shadow:none;border:1px solid #ffffff3a}
.vidrio{background:#ffffff10;border:1px solid #ffffff22;border-radius:24px;backdrop-filter:blur(6px)}

/* lobby */
.lobby{flex:1;display:grid;grid-template-columns:1.05fr 1fr;grid-template-rows:minmax(0,1fr);gap:28px;min-height:0}
.unete{background:var(--papel);color:var(--osc);border-radius:28px;padding:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;box-shadow:0 30px 60px #00000040;position:relative;overflow:hidden}
.unete:before{content:"";position:absolute;inset:auto -60px -80px auto;width:280px;height:280px;border-radius:50%;background:#E1EEF5}
.unete>*{position:relative}
.unete .k{font-size:20px;color:var(--gris)}
.unete .url{font-family:Poppins;font-weight:600;font-size:22px;color:var(--az);word-break:break-all}
.unete .cod{font-family:Poppins;font-weight:800;font-size:118px;letter-spacing:14px;color:var(--azo);line-height:1;margin:4px 0}
.unete img.qr{width:230px;height:230px;border-radius:14px;border:8px solid #fff;box-shadow:0 8px 24px #0B3B5522}
.sala{padding:28px;display:flex;flex-direction:column;gap:18px;min-height:0}
.sala h2{font-size:30px;display:flex;align-items:center;gap:14px;color:#fff}
.sala h2 span{background:var(--oro);color:#2B2100;border-radius:999px;font-size:22px;padding:2px 16px}
.avatares{flex:1;display:flex;flex-wrap:wrap;gap:16px;align-content:flex-start;overflow:auto}
.av{display:flex;flex-direction:column;align-items:center;gap:6px;width:96px;animation:entra .45s cubic-bezier(.2,1.4,.4,1) both}
.av .c{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Poppins;font-weight:700;font-size:24px;color:#fff;box-shadow:0 6px 14px #0000003a}
.av .n{font-size:15px;color:#DCEBF3;text-align:center;line-height:1.2;word-break:break-word}
.av.off{opacity:.35}
@keyframes entra{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.vacio{color:#A9C6DA;font-size:20px}

/* pregunta */
.juego{flex:1;display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:0.85fr 1.35fr;gap:24px;min-height:0}
.qcard{background:var(--papel);color:var(--osc);border-radius:26px;padding:26px 28px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 60px #00000035;min-height:0}
.qhead{display:flex;align-items:center;gap:14px}
.qhead .num{font-family:Poppins;font-weight:600;color:var(--az);font-size:18px;flex:1}
.anillo{position:relative;width:86px;height:86px;flex:none}
.anillo svg{width:86px;height:86px;transform:rotate(-90deg)}
.anillo .v{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Poppins;font-weight:800;font-size:30px;color:var(--azo)}
.anillo.urg .v{color:var(--mal)}
.resp{text-align:center;font-family:Poppins;color:var(--gris);font-size:14px;line-height:1.1}
.resp b{display:block;font-size:32px;color:var(--azo)}
.enun{font-family:Poppins;font-weight:700;font-size:30px;line-height:1.22;color:var(--azo)}
.lamina{flex:1;min-height:120px;max-height:340px;background:var(--fondo);border:1px solid var(--linea);border-radius:18px;padding:14px;display:flex}
.explica{display:flex;gap:14px;align-items:flex-start;background:#E8F6EF;border-radius:16px;padding:14px 18px;font-size:20px;line-height:1.4;color:#173B2B;animation:entra .4s both}
.explica .ico{flex:none;width:40px;height:40px;border-radius:12px;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px}
.ops{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(2,minmax(0,1fr));gap:18px;min-height:0}
.ops.col1{grid-template-columns:1fr;grid-template-rows:repeat(4,minmax(0,1fr));gap:12px}
.op{position:relative;background:var(--papel);color:var(--osc);border-radius:22px;padding:14px 18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 16px 36px #00000030;border:4px solid transparent;transition:opacity .35s,transform .35s,border-color .35s;min-height:0;overflow:hidden}
.ops.col1 .op{flex-direction:row;align-items:center;gap:16px;padding:8px 16px;border-radius:18px}
.op .letra{position:absolute;top:14px;left:14px;width:44px;height:44px;border-radius:14px;color:#fff;font-family:Poppins;font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center;z-index:2}
.ops.col1 .op .letra{position:static;flex:none}
.op .cont{flex:1;min-height:0;min-width:0;height:100%;display:flex;align-items:center;justify-content:center}
.op.txt .cont{justify-content:flex-start;padding-left:60px}
.op.txt .t{font-family:Poppins;font-weight:600;font-size:27px;line-height:1.25;color:var(--azo)}
.op .dib{height:100%}
.op.apagada{opacity:.3;transform:scale(.97)}
.op.buena{border-color:var(--ok);box-shadow:0 0 0 6px #1E9E6A40,0 16px 36px #00000030}
.op .ok{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;z-index:2;animation:entra .4s both}
.ops.col1 .op .ok{position:static;flex:none;order:3}
.op .est{display:flex;flex-direction:column;gap:6px;flex:none}
.ops.col1 .op .est{width:150px}
.op .barra{height:10px;border-radius:6px;background:var(--fondo);overflow:hidden}
.op .barra i{display:block;height:100%;border-radius:6px;width:0;transition:width 1s ease}
.op .votos{font-family:Poppins;font-weight:600;font-size:15px;color:var(--gris)}
.LA{background:var(--A)}.LB{background:var(--B)}.LC{background:var(--C)}.LD{background:var(--D)}
.pie{display:flex;justify-content:flex-end;gap:14px;align-items:center}
.pista{color:#A9C6DA;font-size:15px}

/* clasificación */
.ranking{overflow:auto;max-width:1100px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.ranking h2{font-size:44px;color:#fff;text-align:center;margin-bottom:6px}
.fila{display:grid;grid-template-columns:50px 58px 1fr 120px;align-items:center;gap:16px;background:#ffffff12;border:1px solid #ffffff20;border-radius:18px;padding:12px 20px;animation:entra .45s both}
.fila .pos{font-family:Poppins;font-weight:800;font-size:28px;color:var(--oro);text-align:center}
.fila .c{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Poppins;font-weight:700;font-size:20px;color:#fff}
.fila .nb{display:flex;flex-direction:column;gap:6px}
.fila .nb b{font-family:Poppins;font-size:24px;color:#fff}
.fila .nb .bar{height:10px;background:#ffffff18;border-radius:6px;overflow:hidden}
.fila .nb .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cielo),var(--oro));border-radius:6px;width:0;transition:width 1.1s ease}
.fila .pts{font-family:Poppins;font-weight:700;font-size:28px;color:#fff;text-align:right}
.fila .pts small{display:block;font-size:15px;color:#7FE0B4;font-weight:600}
.podio{display:flex;justify-content:center;align-items:flex-end;gap:26px;margin-top:20px}
.peld{width:250px;display:flex;flex-direction:column;align-items:center;gap:10px;animation:sube .9s both}
.peld .c{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Poppins;font-weight:800;font-size:36px;color:#fff;border:5px solid #fff;box-shadow:0 12px 24px #00000055}
.peld .n{font-family:Poppins;font-weight:700;font-size:24px;color:#fff;text-align:center}
.peld .bloque{width:100%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:16px;color:#2B2100;font-family:Poppins;font-weight:800;font-size:46px}
.peld .bloque small{font-size:18px;font-weight:600}
@keyframes sube{from{transform:translateY(80px);opacity:0}to{transform:none;opacity:1}}
.confeti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confeti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:cae linear forwards}
@keyframes cae{to{transform:translateY(110vh) rotate(720deg)}}

/* ======================= MÓVIL ======================= */
#alumno{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;color:#EAF3F9}
.mtop{display:flex;align-items:center;gap:10px;padding:12px 16px}
.mtop .logo img{height:26px}
.mtop .yo{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:Poppins;font-weight:600;font-size:15px}
.mtop .yo .c{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
.mcuerpo{flex:1;display:flex;flex-direction:column;padding:6px 14px 18px;gap:12px}
.mtarjeta{background:var(--papel);color:var(--osc);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 40px #00000040}
.mtarjeta h1{font-size:25px;color:var(--azo);line-height:1.2}
.mtarjeta p{font-size:16px;color:var(--gris);line-height:1.45}
label{font-family:Poppins;font-size:14px;font-weight:600;color:var(--azo)}
.campo{width:100%;font-size:22px;padding:12px 14px;border:2px solid var(--linea);border-radius:14px;outline:none;background:#fff}
.campo:focus{border-color:var(--az)}
.campo.cod{letter-spacing:10px;text-align:center;font-family:Poppins;font-weight:800;font-size:28px}
.mbtn{width:100%;font-size:20px;padding:15px;border-radius:14px;background:var(--oro);color:#2B2100;font-weight:700}
.mbtn:disabled{opacity:.5}
.error{color:var(--mal);font-weight:700;font-size:15px;min-height:20px}
.centro{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:10px}
.centro .g{font-family:Poppins;font-size:30px;font-weight:800;line-height:1.2;color:#fff}
.centro .m{font-size:18px;color:#CFE3EE;line-height:1.45}
.rueda{width:56px;height:56px;border-radius:50%;border:6px solid #ffffff22;border-top-color:var(--oro);animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.mprog{display:flex;align-items:center;gap:10px;font-family:Poppins;font-weight:600;font-size:15px}
.mprog .tbar{flex:1;height:8px;background:#ffffff22;border-radius:6px;overflow:hidden}
.mprog .tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--oro),var(--cielo));border-radius:6px}
.mpreg{background:var(--papel);color:var(--azo);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.mpreg .t{font-family:Poppins;font-weight:700;font-size:17px;line-height:1.3}
.mpreg .lam{background:var(--fondo);border-radius:12px;padding:6px;height:120px}
.mops{display:flex;flex-direction:column;gap:10px}
.mop{background:var(--papel);color:var(--osc);border-radius:16px;display:flex;align-items:stretch;gap:0;overflow:hidden;text-align:left;box-shadow:0 8px 18px #00000030;min-height:64px;border:3px solid transparent;transition:transform .1s}
.mop:active{transform:scale(.98)}
.mop .letra{flex:none;width:48px;color:#fff;font-family:Poppins;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center}
.mop .t{padding:12px 14px;font-family:Poppins;font-weight:600;font-size:16px;line-height:1.3;color:var(--azo);display:flex;align-items:center}
.mop .dib{height:104px;padding:6px}
.mop.elegida{border-color:var(--oro)}
.mop:disabled{opacity:.55}
.mop.elegida:disabled{opacity:1}
.res-ok{background:linear-gradient(160deg,#25B37A,#0E6B47)!important}
.res-mal{background:linear-gradient(160deg,#E2574C,#8E2620)!important}
.icono{width:110px;height:110px;border-radius:50%;background:#ffffff26;display:flex;align-items:center;justify-content:center;font-size:62px;color:#fff;animation:entra .5s both}
.ptsg{font-family:Poppins;font-size:28px;font-weight:800;background:#ffffff2a;border-radius:14px;padding:6px 18px;color:#fff}
.aviso{position:fixed;inset:auto 12px 12px 12px;background:var(--mal);color:#fff;border-radius:16px;padding:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-weight:700;z-index:9}
.aviso button{background:#fff;color:var(--mal);border-radius:10px;padding:8px 14px;font-weight:700}

@media (max-width:1000px){
  .lobby,.juego{grid-template-columns:1fr}
  .ops{grid-template-rows:auto}
  .op{min-height:200px}
}
</style>
</head>

/* =========================================================================
   CONEXIÓN · servidor MQTT público y gratuito (sin cuentas), como el AquaQuiz
     ?broker=emqx → servidor alternativo si el principal no responde
     ?local       → ensayo en un solo ordenador con varias pestañas
   ========================================================================= */
const CONFIG_RED = {
  brokers: { hivemq: "wss://broker.hivemq.com:8884/mqtt", emqx: "wss://broker.emqx.io:8084/mqtt" },
  libreria: ["https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js", "https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"],
};
const params = new URLSearchParams(location.search);
const ES_PROFE = params.has("profe");
const LOCAL = params.has("local");
const BROKER = CONFIG_RED.brokers[params.get("broker")] ? params.get("broker") : "hivemq";
const PREFIJO = "safa-bd/er-desafio";
const rid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const limpio = (o) => JSON.parse(JSON.stringify(o));

function cargarScript(url) {
  return new Promise((ok, ko) => { const s = document.createElement("script"); s.src = url; s.async = true; s.onload = ok; s.onerror = ko; document.head.appendChild(s); });
}
async function cargarMqtt() {
  if (window.mqtt) return true;
  for (const url of CONFIG_RED.libreria) { try { await cargarScript(url); if (window.mqtt) return true; } catch (e) {} }
  return false;
}
const tema = (codigo, t) => `${PREFIJO}/${codigo}/${t}`;
function clienteMqtt(will) {
  return window.mqtt.connect(CONFIG_RED.brokers[BROKER], {
    clientId: "q_" + rid(), clean: true, keepalive: 30, connectTimeout: 10000, reconnectPeriod: 2000, will });
}

/* ---------- Profesor: crea la sala ---------- */
async function crearSalaMqtt(codigo, { alAbrir, alConectar, alError }) {
  if (!(await cargarMqtt())) return alError("sin-libreria");
  const tSala = tema(codigo, "sala"), tHost = tema(codigo, "alHost");
  const cli = clienteMqtt({ topic: tSala, payload: "", qos: 1, retain: true });
  let abierta = false, comprobando = true;
  const t = setTimeout(() => { if (!abierta) { cli.end(true); alError("servidor"); } }, 12000);
  const conns = new Map();
  const asegurar = (id) => {
    if (!conns.has(id)) {
      const datos = [], cierres = [];
      const c = { send: (o) => cli.publish(tema(codigo, "j/" + id), JSON.stringify(o), { qos: 1 }),
        onData: (f) => datos.push(f), onClose: (f) => cierres.push(f), close: () => {},
        _datos: (m) => datos.forEach((f) => f(m)), _cierre: () => cierres.forEach((f) => f()) };
      conns.set(id, c); alConectar(c);
    }
    return conns.get(id);
  };
  const publicarSala = () => cli.publish(tSala, JSON.stringify({ abierta: true, t: Date.now() }), { qos: 1, retain: true });
  cli.on("message", (topic, buf) => {
    const txt = buf.toString();
    if (topic === tSala) {
      if (comprobando && txt) { try { const m = JSON.parse(txt); if (Date.now() - m.t < 3 * 3600 * 1000) { comprobando = false; clearTimeout(t); cli.end(true); return alError("unavailable-id"); } } catch (e) {} }
      return;
    }
    if (topic !== tHost || !txt) return;
    let m; try { m = JSON.parse(txt); } catch (e) { return; }
    if (!m || !m.de) return;
    if (m.tipo === "adios") { const c = conns.get(m.de); if (c) { conns.delete(m.de); c._cierre(); } return; }
    const c = asegurar(m.de);
    if (m.tipo === "datos") c._datos(m.carga);
  });
  cli.on("connect", () => {
    cli.subscribe([tSala, tHost], { qos: 1 });
    if (abierta) { publicarSala(); return; }          // reconexión
    setTimeout(() => {                                  // espera por si la sala ya existía
      if (!comprobando) return;
      comprobando = false; abierta = true; clearTimeout(t);
      publicarSala();
      addEventListener("pagehide", () => { try { cli.publish(tSala, "", { qos: 1, retain: true }); } catch (e) {} });
      alAbrir();
    }, 1200);
  });
}

/* ---------- Alumno: se une a la sala ---------- */
async function unirseASalaMqtt(codigo, { alAbrir, alCerrar, alError }) {
  if (!(await cargarMqtt())) return alError("sin-libreria");
  const id = rid(), tSala = tema(codigo, "sala"), tHost = tema(codigo, "alHost"), tYo = tema(codigo, "j/" + id);
  const cli = clienteMqtt({ topic: tHost, payload: JSON.stringify({ de: id, tipo: "adios" }), qos: 1, retain: false });
  let estado = "conectando", primera = true;
  const datos = [];
  let ultimoEntrar = null;
  const c = { send: (o) => { if (o && o.t === "entrar") ultimoEntrar = o; cli.publish(tHost, JSON.stringify({ de: id, tipo: "datos", carga: limpio(o) }), { qos: 1 }); },
    onData: (f) => datos.push(f), onClose: () => {},
    close: () => { estado = "cerrado"; try { cli.publish(tHost, JSON.stringify({ de: id, tipo: "adios" }), { qos: 1 }); cli.end(); } catch (e) {} } };
  const t = setTimeout(() => { if (estado === "conectando") { estado = "error"; cli.end(true); alError("servidor"); } }, 12000);
  let tSalaEspera = null;
  cli.on("message", (topic, buf) => {
    const txt = buf.toString();
    if (topic === tSala && estado === "buscando") {
      clearTimeout(tSalaEspera);
      let ok = false; try { ok = !!txt && JSON.parse(txt).abierta; } catch (e) {}
      if (!ok) { estado = "error"; cli.end(true); return alError("peer-unavailable"); }
      estado = "dentro"; cli.unsubscribe(tSala);
      cli.publish(tHost, JSON.stringify({ de: id, tipo: "hola" }), { qos: 1 });
      return alAbrir(c);
    }
    if (topic === tYo && txt) { let m; try { m = JSON.parse(txt); } catch (e) { return; } datos.forEach((f) => f(m)); }
  });
  let tCorte = null;
  cli.on("offline", () => {
    if (estado !== "dentro" || tCorte) return;
    tCorte = setTimeout(() => { estado = "cerrado"; try { cli.end(true); } catch (e) {} alCerrar(); }, 20000);
  });
  cli.on("connect", () => {
    if (!primera) {                                    // vuelve tras un corte: se reincorpora solo
      clearTimeout(tCorte); tCorte = null;
      if (estado !== "dentro") return;
      cli.subscribe(tYo, { qos: 1 });
      if (ultimoEntrar) c.send(ultimoEntrar);
      return;
    }
    primera = false; clearTimeout(t);
    estado = "buscando";
    cli.subscribe([tYo, tSala], { qos: 1 });
    tSalaEspera = setTimeout(() => { if (estado === "buscando") { estado = "error"; cli.end(true); alError("peer-unavailable"); } }, 4000);
  });
}

/* ---------- Canal local (ensayo con varias pestañas del mismo navegador) ---------- */
function canalLocal(codigo) { return new BroadcastChannel("desafio-er-local-" + codigo); }
function connLocal(bc, yo, otro) {
  const datos = [], cierres = [];
  return { send: (o) => bc.postMessage({ de: yo, para: otro, tipo: "datos", carga: limpio(o) }),
    onData: (f) => datos.push(f), onClose: (f) => cierres.push(f), close: () => bc.postMessage({ de: yo, para: otro, tipo: "cierre" }),
    _datos: (m) => datos.forEach(f => f(m)), _cierre: () => cierres.forEach(f => f()) };
}

function crearSala(codigo, h) {
  if (!LOCAL) return crearSalaMqtt(codigo, h);
  const { alAbrir, alConectar } = h, bc = canalLocal(codigo), conns = new Map();
  bc.onmessage = ({ data: m }) => {
    if (m.para !== "host") return;
    if (m.tipo === "conectar") { const c = connLocal(bc, "host", m.de); conns.set(m.de, c); bc.postMessage({ de: "host", para: m.de, tipo: "aceptado" }); alConectar(c); }
    else if (m.tipo === "datos") conns.get(m.de)?._datos(m.carga);
    else if (m.tipo === "cierre") { conns.get(m.de)?._cierre(); conns.delete(m.de); }
  };
  addEventListener("pagehide", () => conns.forEach(c => c.close()));
  setTimeout(alAbrir, 50);
}
function unirseASala(codigo, h) {
  if (!LOCAL) return unirseASalaMqtt(codigo, h);
  const { alAbrir, alCerrar, alError } = h, bc = canalLocal(codigo), yo = rid(), c = connLocal(bc, yo, "host"); let ok = false;
  bc.onmessage = ({ data: m }) => {
    if (m.para !== yo) return;
    if (m.tipo === "aceptado") { ok = true; alAbrir(c); }
    else if (m.tipo === "datos") c._datos(m.carga);
    else if (m.tipo === "cierre") { c._cierre(); alCerrar(); }
  };
  bc.postMessage({ de: yo, para: "host", tipo: "conectar" });
  addEventListener("pagehide", () => c.close());
  setTimeout(() => { if (!ok) alError("peer-unavailable"); }, 3000);
}

/* Texto para el alumno según el error */
function mensajeError(tipo) {
  if (tipo === "peer-unavailable") return "No existe ninguna sala con ese código.";
  if (tipo === "sin-libreria") return "No se ha podido cargar la conexión. Revisa tu Internet.";
  if (tipo === "servidor") return "El servidor no responde. Prueba con los datos del móvil.";
  return "No se ha podido conectar (" + tipo + "). Inténtalo de nuevo.";
}

      alError: (tipo) => {
        if (tipo === "unavailable-id") return abrir();
        esc_.innerHTML = `<div class="unete" style="flex:1"><div class="cod" style="font-size:40px;letter-spacing:0">No se ha podido crear la sala</div>
          <p class="k">${tipo === "sin-libreria" ? "No se ha cargado la librería de conexión (¿hay Internet en este equipo?)." : "Error de red: " + esc(tipo)}</p>
          <button class="btn" onclick="location.reload()">Reintentar</button></div>`;
      }
    });
  }
  function recibir(conn, m, p) {
    if (m.t === "entrar") {
      const nombre = String(m.nombre || "").trim().slice(0, 16), token = String(m.token || "").slice(0, 40);
      if (!nombre || !token) return conn.send({ t: "error", msg: "Escribe un nombre." });
      let yo = S.jug.get(token);
      if (!yo) {
        const mismo = jugadores().find(q => q.nombre.toLowerCase() === nombre.toLowerCase());
        if (mismo && mismo.conectado) return conn.send({ t: "error", msg: "Ese nombre ya está en uso. Prueba con otro." });
        if (mismo) { S.jug.delete(mismo.token); mismo.token = token; S.jug.set(token, mismo); yo = mismo; }
      }
      if (!yo) {
        if (S.estado === "final") return conn.send({ t: "error", msg: "La partida ya ha terminado." });
        yo = { token, nombre, puntos: 0, racha: 0, ultimo: 0, resp: null, conn, conectado: true, res: null };
        S.jug.set(token, yo);
      }
      yo.conn = conn; yo.conectado = true;
      conn.send({ t: "dentro", nombre: yo.nombre });
      sincronizar(yo); if (S.estado === "lobby") pintar();
      return yo;
    }
    if (!p) return;
    if (m.t === "respuesta" && S.estado === "pregunta" && m.i === S.i && !p.resp) {
      const op = Number(m.opcion);
      if (!(op >= 0 && op < 4)) return;
      p.resp = { opcion: op, ms: performance.now() - S.t0 };
      conn.send({ t: "enviada", opcion: op });
      pintarContador(); comprobarTodos();
    }
  }
  const msgPregunta = () => ({ t: "pregunta", i: S.i, restante: Math.max(0, tiempoDe(S.i) * 1000 - (performance.now() - S.t0)) });
  function sincronizar(p) {
    if (S.estado === "pregunta") p.conn.send(p.resp ? { t: "enviada", opcion: p.resp.opcion } : msgPregunta());
    else if ((S.estado === "resultado" || S.estado === "ranking") && p.res) p.conn.send(p.res);
    else if (S.estado === "final") p.conn.send({ t: "final", posicion: posicion(p), total: S.jug.size, puntos: p.puntos });
    else p.conn.send({ t: "espera" });
  }
  function lanzar() {
    S.i++;
    if (S.i >= PREGUNTAS.length) return terminar();
    S.posPrev = new Map(ranking().map((p, k) => [p.token, k + 1]));
    jugadores().forEach(p => { p.resp = null; p.res = null; });
    S.estado = "pregunta"; S.t0 = performance.now();
    conectados().forEach(p => p.conn.send(msgPregunta()));
    pintar();
    clearInterval(S.tic);
    const T = tiempoDe(S.i), L = 2 * Math.PI * 38;
    S.tic = setInterval(() => {
      const r = T - (performance.now() - S.t0) / 1000;
      const v = $("#p-reloj"), arc = $("#p-arco");
      if (v) { v.textContent = Math.max(0, Math.ceil(r)); v.parentElement.classList.toggle("urg", r <= 5); }
      if (arc) { arc.style.strokeDashoffset = L * (1 - Math.max(0, r) / T); arc.style.stroke = r <= 5 ? "#D0453A" : "#006491"; }
      if (r <= 0) corregir();
    }, 150);
  }
  function comprobarTodos() {
    if (S.estado !== "pregunta") return;
    const c = conectados();
    if (c.length && c.every(p => p.resp)) setTimeout(corregir, 400);
  }
  function corregir() {
    if (S.estado !== "pregunta") return;
    clearInterval(S.tic);
    const ok = buena(S.i), q = PREGUNTAS[S.i];
    jugadores().forEach(p => {
      const acierto = !!p.resp && p.resp.opcion === ok;
      let pts = 0;
      if (acierto) { p.racha++; pts = puntosPor(p.resp.ms, tiempoDe(S.i)) + Math.min(Math.max(p.racha - 1, 0), 5) * 100; } else p.racha = 0;
      p.ultimo = pts; p.puntos += pts;
    });
    S.estado = "resultado";
    jugadores().forEach(p => {
      const o = q.opciones[ok];
      p.res = { t: "resultado", acierto: !!p.resp && p.resp.opcion === ok, respondio: !!p.resp, puntos: p.ultimo, total: p.puntos,
                posicion: posicion(p), racha: p.racha, letra: LETRAS[ok], correcta: o.t || "" };
    });
    conectados().forEach(p => p.conn.send(p.res));
    pintar();
  }
  function terminar() {
    clearInterval(S.tic); S.estado = "final";
    conectados().forEach(p => p.conn.send({ t: "final", posicion: posicion(p), total: S.jug.size, puntos: p.puntos }));
    pintar(); confeti();
  }
  function confeti() {
    const d = document.createElement("div"); d.className = "confeti";
    for (let k = 0; k < 140; k++) {
      const i = document.createElement("i");
      i.style.left = Math.random() * 100 + "vw"; i.style.background = PALETA[k % PALETA.length].concat("");
      i.style.animationDuration = 2.5 + Math.random() * 3 + "s"; i.style.animationDelay = Math.random() * 1.5 + "s";
      i.style.transform = `rotate(${Math.random() * 360}deg)`; d.appendChild(i);
    }
    document.body.appendChild(d); setTimeout(() => d.remove(), 8000);
  }

  function pintarContador() { const el = $("#p-resp"); if (el) el.innerHTML = `<b>${jugadores().filter(p => p.resp).length}</b>respuestas`; }
  function pintar() {
    puntos();
    if (S.estado === "lobby") {
      const url = urlAlumno(), qr = "https://api.qrserver.com/v1/create-qr-code/?size=500x500&margin=6&color=0B3B55&data=" + encodeURIComponent(url);
      const js = jugadores();
      esc_.innerHTML = `<div class="lobby">
        <div class="unete"><div class="k">Entra desde el móvil en</div><div class="url">${esc(url.replace(/^https?:\/\//, "").split("?")[0])}</div>
          <div class="k">con el código</div><div class="cod">${S.codigo}</div><img class="qr" src="${qr}" alt="QR para entrar" onerror="this.remove()">
          <div class="k" style="font-size:16px">${PREGUNTAS.length} retos · ${TIEMPO} s por pregunta${LOCAL ? " · MODO ENSAYO LOCAL" : ""}</div></div>
        <div class="sala vidrio"><h2>Jugadores <span>${conectados().length}</span></h2>
          <div class="avatares">${js.map(p => `<div class="av ${p.conectado ? "" : "off"}">${avatar(p.nombre)}<div class="n">${esc(p.nombre)}</div></div>`).join("") || '<div class="vacio">Esperando a que entren los alumnos…</div>'}</div>
          <div class="pie"><span class="pista">Intro para empezar</span><button class="btn" id="p-sig" ${conectados().length ? "" : "disabled"}>Empezar ▶</button></div></div></div>`;
      $("#p-sig").onclick = lanzar; return;
    }
    if (S.estado === "pregunta" || S.estado === "resultado") {
      const q = PREGUNTAS[S.i], rev = S.estado === "resultado", ok = rev ? buena(S.i) : -1;
      const tot = Math.max(1, jugadores().filter(p => p.resp).length);
      const cuentas = [0, 1, 2, 3].map(k => jugadores().filter(p => p.resp && p.resp.opcion === k).length);
      const L = 2 * Math.PI * 38;
      esc_.innerHTML = `<div class="juego">
        <div class="qcard"><div class="qhead"><div class="num">Reto ${S.i + 1} de ${PREGUNTAS.length}</div>
          ${rev ? "" : `<div class="resp" id="p-resp"></div><div class="anillo"><svg viewBox="0 0 86 86"><circle cx="43" cy="43" r="38" fill="none" stroke="#E1EEF5" stroke-width="8"/>
            <circle id="p-arco" cx="43" cy="43" r="38" fill="none" stroke="#006491" stroke-width="8" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="0" style="transition:stroke-dashoffset .15s linear"/></svg><div class="v" id="p-reloj">${tiempoDe(S.i)}</div></div>`}</div>
          <div class="enun">${esc(q.texto)}</div>
          ${q.img ? `<div class="lamina"><div class="dib">${q.img}</div></div>` : ""}
          ${rev && q.explicacion ? `<div class="explica"><div class="ico">💡</div><div>${q.explicacion}</div></div>` : ""}
        </div>
        <div style="display:flex;flex-direction:column;gap:16px;min-height:0">
          <div class="ops ${q.opciones.some(o => !o.t) ? "col1" : ""}" style="flex:1">${q.opciones.map((o, k) => `<div class="op ${o.t ? "txt" : ""} ${rev ? (k === ok ? "buena" : "apagada") : ""}">
            <div class="letra L${LETRAS[k]}">${LETRAS[k]}</div>
            <div class="cont">${o.t ? `<div class="t">${esc(o.t)}</div>` : `<div class="dib">${o.img}</div>`}</div>
            ${k === ok ? '<div class="ok">✓</div>' : ""}
            ${rev ? `<div class="est"><div class="votos">${cuentas[k]} ${cuentas[k] === 1 ? "voto" : "votos"}</div><div class="barra"><i class="L${LETRAS[k]}" data-w="${Math.round(cuentas[k] / tot * 100)}"></i></div></div>` : ""}</div>`).join("")}</div>
          <div class="pie">${rev ? '<span class="pista">Intro para continuar</span><button class="btn" id="p-sig">Clasificación ▶</button>'
                                 : '<button class="btn claro" id="p-cerrar">Cerrar reto</button>'}</div></div></div>`;
      if (rev) { $("#p-sig").onclick = () => { S.estado = "ranking"; pintar(); }; requestAnimationFrame(() => setTimeout(() => esc_.querySelectorAll(".barra i").forEach(i => i.style.width = i.dataset.w + "%"), 60)); }
      else { $("#p-cerrar").onclick = corregir; pintarContador(); }
      return;
    }
    if (S.estado === "ranking") {
      const r = ranking(), top = r.slice(0, 6), max = Math.max(1, r[0]?.puntos || 1), ult = S.i + 1 >= PREGUNTAS.length;
      esc_.innerHTML = `<div class="ranking"><h2>Clasificación</h2>
        ${top.map((p, k) => { const antes = S.posPrev.get(p.token), sube = antes && antes > k + 1;
          return `<div class="fila" style="animation-delay:${k * 0.07}s"><div class="pos">${k + 1}</div>${avatar(p.nombre)}
          <div class="nb"><b>${esc(p.nombre)} ${sube ? '<span style="color:#7FE0B4">▲</span>' : ""}</b><div class="bar"><i data-w="${Math.round(p.puntos / max * 100)}"></i></div></div>
          <div class="pts">${p.puntos}${p.ultimo ? `<small>+${p.ultimo}</small>` : ""}</div></div>`; }).join("") || '<div class="vacio">Sin jugadores</div>'}
        <div class="pie" style="margin-top:8px"><span class="pista">Intro para continuar</span><button class="btn" id="p-sig">${ult ? "Ver podio 🏆" : "Siguiente reto ▶"}</button></div></div>`;
      $("#p-sig").onclick = lanzar;
      setTimeout(() => esc_.querySelectorAll(".bar i").forEach(i => i.style.width = i.dataset.w + "%"), 80);
      return;
    }
    if (S.estado === "final") {
      const r = ranking(), alt = [230, 170, 130], col = ["#F2C94C", "#C9D3DB", "#E0A36B"], orden = [1, 0, 2];
      esc_.innerHTML = `<div class="ranking"><h2>¡Enhorabuena!</h2>
        <div class="podio">${orden.filter(k => r[k]).map(k => `<div class="peld" style="animation-delay:${(2 - k) * 0.45}s">${avatar(r[k].nombre)}<div class="n">${esc(r[k].nombre)}</div>
          <div class="bloque" style="height:${alt[k]}px;background:${col[k]}">${k + 1}º<small>${r[k].puntos} pts</small></div></div>`).join("")}</div>
        ${r.slice(3, 8).map((p, k) => `<div class="fila"><div class="pos">${k + 4}</div>${avatar(p.nombre)}<div class="nb"><b>${esc(p.nombre)}</b></div><div class="pts">${p.puntos}</div></div>`).join("")}
        <div class="pie"><button class="btn claro" onclick="location.reload()">Nueva partida</button></div></div>`;
    }
  }
  addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const b = $("#p-sig"); if (b && !b.disabled) { e.preventDefault(); b.click(); }
  });
  esc_.innerHTML = '<div class="centro"><div class="rueda"></div><div class="m">Creando la sala…</div></div>';
  abrir();
}

/* ============================ ALUMNO ============================ */
function iniciarAlumno() {
  $("#alumno").classList.remove("oculto");
  const cuerpo = $("#a-cuerpo"), app = $("#alumno");
  let conn = null, nombre = "", codigo = params.get("sala") || "", tic = null, iActual = -1, token = null;
  try { token = sessionStorage.getItem("desafioER-token"); } catch (e) {}
  if (!token) { token = rid(); try { sessionStorage.setItem("desafioER-token", token); } catch (e) {} }
  try { nombre = localStorage.getItem("desafioER-nombre") || ""; } catch (e) {}

  const fondo = (cls) => { document.body.classList.remove("res-ok", "res-mal"); if (cls) document.body.classList.add(cls); };
  const centro = (html) => { fondo(null); clearInterval(tic); cuerpo.innerHTML = `<div class="centro">${html}</div>`; };

  function formulario(err) {
    fondo(null); clearInterval(tic);
    cuerpo.innerHTML = `<div class="mtarjeta"><h1>Desafío E/R → Relacional</h1><p>Escribe el código que aparece en el proyector y tu nombre.</p>
      <label for="a-cod">Código</label><input id="a-cod" class="campo cod" inputmode="numeric" maxlength="4" value="${esc(codigo)}" autocomplete="off">
      <label for="a-nom">Tu nombre</label><input id="a-nom" class="campo" maxlength="16" value="${esc(nombre)}" autocomplete="off" placeholder="Nombre y apellido">
      <div class="error" id="a-err">${err ? esc(err) : ""}</div><button class="mbtn" id="a-entrar">Entrar</button></div>`;
    $("#a-entrar").onclick = () => {
      codigo = $("#a-cod").value.replace(/\D/g, ""); nombre = $("#a-nom").value.trim();
      if (codigo.length !== 4) return ($("#a-err").textContent = "El código tiene 4 cifras.");
      if (!nombre) return ($("#a-err").textContent = "Escribe tu nombre.");
      try { localStorage.setItem("desafioER-nombre", nombre); } catch (e) {}
      conectar();
    };
    $(codigo ? "#a-nom" : "#a-cod").focus();
  }
  function conectar() {
    $("#a-aviso").classList.add("oculto");
    centro('<div class="rueda"></div><div class="m">Conectando con la sala…</div>');
    unirseASala(codigo, {
      alAbrir: (c) => { conn = c; c.onData(recibir); c.send({ t: "entrar", nombre, token }); },
      alCerrar: () => { conn = null; $("#a-aviso").classList.remove("oculto"); },
      alError: (tipo) => formulario(mensajeError(tipo))
    });
  }
  function recibir(m) {
    if (!m || typeof m !== "object") return;
    if (m.t === "error") { conn?.close(); conn = null; return formulario(m.msg); }
    if (m.t === "dentro") { nombre = m.nombre; $("#a-yo").innerHTML = avatar(nombre) + esc(nombre); return; }
    if (m.t === "espera") return centro(`<div class="icono">👋</div><div class="g">¡Ya estás dentro!</div><div class="m">Busca tu nombre en el proyector.<br>El desafío empieza enseguida.</div>`);
    if (m.t === "pregunta") return pintarPregunta(m);
    if (m.t === "enviada") return enviada(m.opcion);
    if (m.t === "resultado") {
      clearInterval(tic); fondo(m.acierto ? "res-ok" : "res-mal");
      cuerpo.innerHTML = `<div class="centro"><div class="icono">${m.acierto ? "✓" : m.respondio ? "✗" : "⏱"}</div>
        <div class="g">${m.acierto ? "¡Correcto!" : m.respondio ? "Esta vez no" : "¡Se acabó el tiempo!"}</div>
        ${m.acierto ? `<div class="ptsg">+${m.puntos}</div>${m.racha > 1 ? `<div class="m">🔥 Racha de ${m.racha}</div>` : ""}`
                    : `<div class="m">La correcta era la <b>${m.letra}</b>${m.correcta ? ": " + esc(m.correcta) : ""}</div>`}
        <div class="m">Vas el <b>${m.posicion}º</b> · ${m.total} puntos</div><div class="m" style="font-size:15px">Mira la explicación en el proyector</div></div>`;
      return;
    }
    if (m.t === "final") {
      const med = ["🥇", "🥈", "🥉"][m.posicion - 1] || "🎉";
      return centro(`<div style="font-size:84px">${med}</div><div class="g">Has quedado ${m.posicion}º de ${m.total}</div><div class="m">${m.puntos} puntos · ¡Gracias por jugar!</div>`);
    }
  }
  function enviada(op) {
    const ya = cuerpo.querySelector(".mops");
    if (ya && iActual >= 0) {
      cuerpo.querySelectorAll(".mop").forEach((b, k) => { b.disabled = true; b.classList.toggle("elegida", k === op); });
      const h = cuerpo.querySelector(".mprog span"); if (h) h.textContent = "Respuesta enviada ✓";
      return;
    }
    centro(`<div class="rueda"></div><div class="g">Respuesta enviada</div><div class="m">Espera a que termine el tiempo…</div>`);
  }
  function pintarPregunta(m) {
    fondo(null); iActual = m.i;
    const q = PREGUNTAS[m.i]; if (!q) return;
    cuerpo.innerHTML = `<div class="mprog"><span>Reto ${m.i + 1}/${PREGUNTAS.length}</span><div class="tbar"><i id="a-t" style="width:100%"></i></div><b id="a-s"></b></div>
      <div class="mpreg"><div class="t">${esc(q.texto)}</div>${q.img ? `<div class="lam"><div class="dib">${q.img}</div></div>` : ""}</div>
      <div class="mops">${q.opciones.map((o, k) => `<button class="mop" data-k="${k}"><div class="letra L${LETRAS[k]}">${LETRAS[k]}</div>
        ${o.t ? `<div class="t">${esc(o.t)}</div>` : `<div class="dib" style="flex:1">${o.img}</div>`}</button>`).join("")}</div>`;
    cuerpo.querySelectorAll(".mop").forEach(b => b.onclick = () => {
      if (!conn) return;
      cuerpo.querySelectorAll(".mop").forEach(x => { x.disabled = true; x.classList.toggle("elegida", x === b); });
      conn.send({ t: "respuesta", i: iActual, opcion: Number(b.dataset.k) });
    });
    const T = tiempoDe(m.i) * 1000, fin = Date.now() + m.restante;
    clearInterval(tic);
    const act = () => { const r = Math.max(0, fin - Date.now()); const s = $("#a-s"), t = $("#a-t");
      if (s) s.textContent = Math.ceil(r / 1000) + " s"; if (t) t.style.width = (r / T * 100) + "%"; };
    act(); tic = setInterval(act, 200);
    scrollTo(0, 0);
  }
  $("#a-reconectar").onclick = () => { if (codigo && nombre) conectar(); else formulario(); };
  formulario();
}

ES_PROFE ? iniciarProfe() : iniciarAlumno();
</script>
</body>
</html>
